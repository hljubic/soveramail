# Asks every contributor to sign the CLA (CLA.md) once, on their first pull request.
# Signatures are stored in signatures/cla.json on the main branch.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/hljubic/soveramail/blob/main/CLA.md
          branch: main
          allowlist: hljubic,dependabot[bot],bot*
          create-file-commit-message: 'Create the CLA signatures file'
          signed-commit-message: '$contributorName signed the CLA in $owner/$repo#$pullRequestNo'
          custom-notsigned-prcomment: 'Thank you for your contribution! Before we can merge it, please sign the [Contributor License Agreement](https://github.com/hljubic/soveramail/blob/main/CLA.md) (you keep your copyright; it lets Sovera Mail stay AGPL and also be offered under a commercial license). Sign by replying to this pull request with the sentence below. You only do this once.'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you!'
