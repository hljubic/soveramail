name: soveramail

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${API_URL:-http://localhost:8090}
  FRONTEND_URL: ${WEB_URL:-http://localhost:3000}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-soveramail}
  DB_USERNAME: ${DB_USERNAME:-sovera}
  DB_PASSWORD: ${DB_PASSWORD:-sovera}
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  SESSION_DRIVER: database
  LOG_CHANNEL: stderr
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${API_URL:-http://localhost:8090}/api/auth/google/callback
  MAIL_SYNC_INITIAL_LIMIT: ${MAIL_SYNC_INITIAL_LIMIT:-100}
  MAIL_SYNC_INTERVAL_MINUTES: ${MAIL_SYNC_INTERVAL_MINUTES:-5}
  MAIL_SYNC_BATCH_PAUSE_MS: ${MAIL_SYNC_BATCH_PAUSE_MS:-600}
  API_KEY: ${API_KEY:-}
  API_EXTRA_HOSTS: ${API_EXTRA_HOSTS:-}
  AI_ALLOW_REMOTE: ${AI_ALLOW_REMOTE:-false}
  # Longer than the longest job (900 s): a slow slice is never handed to a second worker.
  DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-1000}
  SOVERA_TIMEZONE: ${SOVERA_TIMEZONE:-UTC}

x-api-base: &api-base
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: soveramail/api:local
  volumes:
    - ./api:/var/www/html
  environment: *api-env
  extra_hosts:
    - "host.docker.internal:host-gateway"  # reach Ollama on the host (Linux needs this; Docker Desktop has it built in)
  depends_on:
    mysql:
      condition: service_healthy

services:
  mysql:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    image: soveramail/mysql:local
    command: --mysql-native-password=OFF --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-soveramail}
      MYSQL_USER: ${DB_USERNAME:-sovera}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sovera}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: composer install, APP_KEY, migrations. Others wait for it.
  api-init:
    <<: *api-base
    environment:
      <<: *api-env
      ROLE: init
    restart: "no"

  api:
    <<: *api-base
    depends_on:
      mysql:
        condition: service_healthy
      api-init:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: soveramail/nginx:local
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api:/var/www/html:ro
    ports:
      - "127.0.0.1:${API_PORT_HOST:-8090}:80"
    depends_on:
      - api
    restart: unless-stopped

  queue:
    <<: *api-base
    environment:
      <<: *api-env
      ROLE: queue
      QUEUE_NAMES: default
    depends_on:
      mysql:
        condition: service_healthy
      api-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Local-model work (vector index, categories / urgency, writing style) in parallel with
  # syncing: one waits on Gmail, the other on Ollama.
  queue-ai:
    <<: *api-base
    environment:
      <<: *api-env
      ROLE: queue
      QUEUE_NAMES: ai
    depends_on:
      mysql:
        condition: service_healthy
      api-init:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    <<: *api-base
    environment:
      <<: *api-env
      ROLE: scheduler
    depends_on:
      mysql:
        condition: service_healthy
      api-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: soveramail/web:local
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx nuxi dev --host 0.0.0.0 --port 3000"
    environment:
      NUXT_PUBLIC_API_BASE: ${API_URL:-http://localhost:8090}
      NUXT_PUBLIC_API_KEY: ${API_KEY:-}
      NUXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:${WEB_PORT_HOST:-3000}:3000"
    restart: unless-stopped

  # Throwaway IMAP/SMTP server for the integration tests. Never started by
  # default:  docker compose --profile mailtest up -d greenmail
  greenmail:
    image: greenmail/standalone:2.1.10
    profiles: ["mailtest"]
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=me:app-password@sovera.test,ana:pw@sovera.test
    ports:
      - "127.0.0.1:3143:3143"   # IMAP
      - "127.0.0.1:3025:3025"   # SMTP

volumes:
  mysql-data:
  web-node-modules:
