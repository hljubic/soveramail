server {
    listen 80;
    server_name _;
    server_tokens off;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64m;

    access_log off;  # privacy: search terms live in query strings
    error_log  /dev/stderr warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Re-resolve the api container on every request so `docker compose up -d --build api`
    # does not leave nginx pointing at a stale container IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream api:9000;

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
